name: Firebase Diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce the tablet's anonymous check-in
        run: |
          set -e
          KEY="AIzaSyAMKqrsk5QLaHulz36-mOgcFD1b_OResjI"
          DB="https://suguna-admin-eee8b-default-rtdb.europe-west1.firebasedatabase.app"

          echo "=== 1. anonymous sign-in (same as the tablet) ==="
          SIGN=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY" \
            -H "Content-Type: application/json" -d '{"returnSecureToken":true}')
          echo "$SIGN" | head -c 300; echo
          TOKEN=$(echo "$SIGN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('idToken',''))")
          DUID=$(echo "$SIGN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('localId',''))")
          echo "signed in? token=${TOKEN:+YES} uid=$DUID"
          [ -z "$TOKEN" ] && { echo "SIGN-IN FAILED — anonymous auth not working"; exit 0; }

          echo "=== 2. write own device record (the check-in) ==="
          W=$(curl -s -o /tmp/w.txt -w "%{http_code}" -X PATCH "$DB/devices/$DUID.json?auth=$TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"DIAG_TEST\",\"enrollment\":\"000\",\"battery\":55,\"lastSeen\":$(date +%s)000}")
          echo "write HTTP: $W"; echo "response: $(cat /tmp/w.txt | head -c 300)"

          echo "=== 3. read own record back ==="
          R=$(curl -s -o /tmp/r.txt -w "%{http_code}" "$DB/devices/$DUID.json?auth=$TOKEN")
          echo "read-own HTTP: $R"; echo "response: $(cat /tmp/r.txt | head -c 300)"

          echo "=== 4. anonymous tries to LIST all devices (should be DENIED if rules are right) ==="
          L=$(curl -s -o /tmp/l.txt -w "%{http_code}" "$DB/devices.json?auth=$TOKEN")
          echo "list-all HTTP: $L"; echo "response: $(cat /tmp/l.txt | head -c 200)"

          echo "=== VERDICT ==="
          if [ "$W" = "200" ]; then
            echo "DEVICE WRITE WORKS — the tablet's check-in path is fine (rules allow it)."
            echo "If the panel is empty, the issue is the tablet not running/online, OR the admin read."
          else
            echo "DEVICE WRITE BLOCKED ($W) — the security rules are not allowing device writes."
            echo "Fix: publish the rules (with the correct admin email)."
          fi
