name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_URL: https://suguna-admin-eee8b-default-rtdb.europe-west1.firebasedatabase.app
      DB_SECRET: ${{ secrets.DB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PDB_URL="$DB_URL" -PDB_SECRET="$DB_SECRET"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SureMDM.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SureMDM-apk
          path: SureMDM.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest SureMDM build
          files: SureMDM.apk
