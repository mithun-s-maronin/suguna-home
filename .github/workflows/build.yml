name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the fleet signing key (original CN=Suguna Home)
        env:
          FLEET_KEY_PASS: ${{ secrets.FLEET_KEY_PASS }}
        run: |
          if [ -n "$FLEET_KEY_PASS" ] && [ -f app/fleet.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in app/fleet.keystore.enc \
              -out app/suguna.keystore -pass pass:"$FLEET_KEY_PASS"
            echo "Fleet key restored — SureMDM will update the existing fleet in place."
          else
            echo "No FLEET_KEY_PASS secret set — building with the default key (not fleet-installable)."
          fi

      - name: Build debug APKs (MDM + companion agent)
        run: ./gradlew :app:assembleDebug :agent:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SureMDM.apk
          cp agent/build/outputs/apk/debug/agent-debug.apk SugunaAgent.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            SureMDM.apk
            SugunaAgent.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest builds
          files: |
            SureMDM.apk
            SugunaAgent.apk
