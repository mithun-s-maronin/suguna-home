name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APKs (MDM + companion agent)
        run: ./gradlew :app:assembleDebug :agent:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SureMDM.apk
          cp agent/build/outputs/apk/debug/agent-debug.apk SugunaAgent.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            SureMDM.apk
            SugunaAgent.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest builds
          files: |
            SureMDM.apk
            SugunaAgent.apk
