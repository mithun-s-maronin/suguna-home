name: Build APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_URL: https://suguna-admin-eee8b-default-rtdb.europe-west1.firebasedatabase.app
      DB_SECRET: ${{ secrets.DB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APKs (fork + agent)
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PDB_URL="$DB_URL" -PDB_SECRET="$DB_SECRET"

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SureMDM.apk
          cp agent/build/outputs/apk/debug/agent-debug.apk SugunaAgent.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            SureMDM.apk
            SugunaAgent.apk

      # main/master → the "latest" release. Any other branch → its own pre-release
      # ("build-<branch>"), so testing a branch never replaces what's in "latest".
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'latest' || format('build-{0}', github.ref_name) }}
          name: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'Latest builds' || format('Test build ({0})', github.ref_name) }}
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
          target_commitish: ${{ github.sha }}
          files: |
            SureMDM.apk
            SugunaAgent.apk
