name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_URL: https://suguna-admin-eee8b-default-rtdb.europe-west1.firebasedatabase.app
      DB_SECRET: ${{ secrets.DB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APKs (fork + agent)
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PDB_URL="$DB_URL" -PDB_SECRET="$DB_SECRET"

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SureMDM.apk
          cp agent/build/outputs/apk/debug/agent-debug.apk SugunaAgent.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            SureMDM.apk
            SugunaAgent.apk

      # Only main/master builds replace the "latest" release; other branches just upload artifacts.
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest builds
          files: |
            SureMDM.apk
            SugunaAgent.apk
